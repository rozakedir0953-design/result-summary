<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your results summary: an overall score of 76, with a breakdown by category."
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Results summary</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-white grid min-h-screen min-w-[320px] place-items-center bg-[hsl(221,100%,96%)] font-sans text-[hsl(224,30%,27%)] antialiased max-[640px]"
  >
    <main
      class="grid min-h-[32rem] w-[calc(100%_-_2rem)] max-w-[46rem] grid-cols-2 overflow-hidden rounded-[2rem] bg-white shadow-[0_1.5rem_3rem_hsla(224,82%,58%,0.12)] max-[640px]:min-h-screen max-[640px]:w-full max-[640px]:grid-cols-1 max-[640px]:overflow-visible max-[640px]:rounded-none max-[640px]:shadow-none"
    >
      <section
        class="flex flex-col items-center rounded-[2rem] bg-gradient-to-b from-[hsl(252,100%,67%)] to-[hsl(241,81%,54%)] px-11 pb-11 pt-9 text-center text-white max-[640px]:min-h-[22.25rem] max-[640px]:rounded-b-[2rem] max-[640px]:rounded-t-none max-[640px]:px-6 max-[640px]:pb-10 max-[640px]:pt-6"
      >
        <h1
          class="m-0 text-2xl font-bold leading-[1.3] text-[hsl(241,100%,89%)] max-[640px]:text-lg"
        >
          Your Result
        </h1>
        <div
          class="mt-[32px] flex aspect-square w-[12.5rem] flex-col items-center justify-center rounded-full bg-gradient-to-b from-[hsla(256,72%,46%,1)] to-[hsla(241,72%,46%,0)] max-[640px]:mt-6 max-[640px]:w-[8.75rem]"
        >
          <span
            class="text-[4.5rem] font-extrabold leading-none max-[640px]:text-6xl"
            >76</span
          >
          <span
            class="mt-1 text-lg font-bold text-[hsla(241,100%,89%,0.72)] max-[640px]:text-base"
          >
            of 100
          </span>
        </div>
        <h2
          class="mb-0 mt-8 text-[2rem] font-bold leading-[1.3] max-[640px]:mt-5 max-[640px]:text-2xl"
        >
          Great
        </h2>
        <p
          class="mb-0 mt-3 max-w-64 text-lg leading-[1.35] text-[hsl(241,100%,89%)] max-[640px]:mt-1.5 max-[640px]:max-w-72 max-[640px]:text-base"
        >
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </section>

      <section
        class="px-10 pb-11 pt-9 max-[640px]:px-[1.875rem] max-[640px]:pb-[1.875rem] max-[640px]:pt-6"
      >
        <h2
          class="mb-[1.625rem] mt-0 text-2xl font-bold leading-[1.3] max-[640px]:mb-6 max-[640px]:text-lg"
        >
          Summary
        </h2>
        <ul class="m-0 grid list-none gap-4 p-0">
          <li
            class="flex min-h-14 items-center justify-between gap-2 rounded-xl bg-[hsla(0,100%,67%,0.06)] px-4 py-3 text-lg max-[640px]:text-base"
          >
            <span
              class="inline-flex items-center gap-3 font-medium text-[hsl(0,100%,67%)]"
            >
              <img
                src="./assets/images/icon-reaction.svg"
                alt=""
                class="block size-5"
              />
              Reaction
            </span>
            <span class="whitespace-nowrap font-bold">
              80
              <span class="font-medium text-[hsla(224,30%,27%,0.5)]"
                >/ 100</span
              >
            </span>
          </li>
          <li
            class="flex min-h-14 items-center justify-between gap-2 rounded-xl bg-[hsla(39,100%,56%,0.07)] px-4 py-3 text-lg max-[640px]:text-base"
          >
            <span
              class="inline-flex items-center gap-3 font-medium text-[hsl(39,100%,45%)]"
            >
              <img
                src="./assets/images/icon-memory.svg"
                alt=""
                class="block size-5"
              />
              Memory
            </span>
            <span class="whitespace-nowrap font-bold">
              92
              <span class="font-medium text-[hsla(224,30%,27%,0.5)]"
                >/ 100</span
              >
            </span>
          </li>
          <li
            class="flex min-h-14 items-center justify-between gap-2 rounded-xl bg-[hsla(166,100%,37%,0.07)] px-4 py-3 text-lg max-[640px]:text-base"
          >
            <span
              class="inline-flex items-center gap-3 font-medium text-[hsl(166,100%,30%)]"
            >
              <img
                src="./assets/images/icon-verbal.svg"
                alt=""
                class="block size-5"
              />
              Verbal
            </span>
            <span class="whitespace-nowrap font-bold">
              61
              <span class="font-medium text-[hsla(224,30%,27%,0.5)]"
                >/ 100</span
              >
            </span>
          </li>
          <li
            class="flex min-h-14 items-center justify-between gap-2 rounded-xl bg-[hsla(234,85%,45%,0.06)] px-4 py-3 text-lg max-[640px]:text-base"
          >
            <span
              class="inline-flex items-center gap-3 font-medium text-[hsl(234,85%,45%)]"
            >
              <img
                src="./assets/images/icon-visual.svg"
                alt=""
                class="block size-5"
              />
              Visual
            </span>
            <span class="whitespace-nowrap font-bold">
              73
              <span class="font-medium text-[hsla(224,30%,27%,0.5)]"
                >/ 100</span
              >
            </span>
          </li>
        </ul>
        <button
          type="button"
          class="mt-10 min-h-14 w-full cursor-pointer rounded-full border-0 bg-[hsl(224,30%,27%)] font-sans text-lg font-bold text-white transition-colors hover:bg-gradient-to-b hover:from-[hsl(252,100%,67%)] hover:to-[hsl(241,81%,54%)] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-[3px] focus-visible:outline-[hsl(224,30%,27%)] max-[640px]:mt-6 max-[640px]:text-base"
        >
          Continue
        </button>
      </section>
    </main>
  </body>
</html>
